---
# Only execute these steps on a single frontend host AND when VM HA validation is enabled

# The host_error hook runs on the RAFT LEADER, so /var/log/one/host_error.log
# exists only there — on an FE-HA zone that is usually NOT the primary
# frontend this role runs on (reading it locally made every hook/fencing
# check fail while fencing had actually succeeded). Resolve the leader once
# and delegate every host_error.log read to it; single-frontend deployments
# resolve to this same host.
- name: Resolve the RAFT leader that runs the host_error hook
  ansible.builtin.shell: >
    onezone show 0 -j
  register: _vm_ha_zone_json
  changed_when: false
  failed_when: false
  become: true
  become_user: oneadmin

- name: Read each frontend's RAFT SERVER_ID
  ansible.builtin.shell: >
    awk -F= '/^[[:space:]]*SERVER_ID[[:space:]]*=/{gsub(/[^0-9]/,"",$2); print $2; exit}'
    {{ validation.vm_ha.oned_conf | d('/etc/one/oned.conf') }}
  register: _vm_ha_server_ids
  changed_when: false
  failed_when: false
  delegate_to: "{{ item }}"
  loop: "{{ groups[frontend_group | d('frontend')] | d([]) }}"

- name: Map the leader's SERVER_ID to an inventory host
  ansible.builtin.set_fact:
    _vm_ha_log_host: "{{ (_matches | first) | d(inventory_hostname, true) }}"
  vars:
    _servers: >-
      {{ ((_vm_ha_zone_json.stdout | d('{}') | from_json).ZONE | d({})).SERVER_POOL | d({}) }}
    _server_raw: "{{ _servers.SERVER | d([]) }}"
    _server_list: "{{ [_server_raw] if (_server_raw is mapping) else _server_raw }}"
    _leader_id: >-
      {{ (_server_list | selectattr('STATE', 'equalto', '3') | map(attribute='ID')
          | list | first) | d('', true) }}
    _matches: >-
      {{ _vm_ha_server_ids.results | d([])
         | selectattr('stdout', 'defined')
         | selectattr('stdout', 'equalto', _leader_id | string)
         | map(attribute='item') | list }}

- name: Show which frontend holds the hook log
  ansible.builtin.debug:
    msg: >-
      host_error.log will be read on '{{ _vm_ha_log_host }}' (RAFT leader;
      falls back to this host when the leader cannot be resolved).

- name: Get last timestamp from host_error.log before test
  ansible.builtin.shell: |
    if [ -s /var/log/one/host_error.log ]; then
      awk -F'[][]' '/^[[]/{ts=$2} END{if(ts) print ts}' /var/log/one/host_error.log
    else
      echo ""
    fi
  register: last_host_error_timestamp
  delegate_to: "{{ _vm_ha_log_host }}"
  changed_when: false

- name: Force status update to notice the error quicker
  ansible.builtin.command: onehost forceupdate {{ host_id }}
  register: forceupdate_result
  changed_when: false
  failed_when: forceupdate_result.rc != 0
  become: true
  become_user: oneadmin

- name: Wait for error state on the host
  ansible.builtin.shell: >
    onehost list --f ID={{ host_id }} -l STAT --no-header
  register: host_state
  failed_when: "host_state.rc != 0"
  until: host_state.stdout == "err"
  retries: 30
  delay: 5

- name: Save host error detection
  set_fact:
    verification_result: "{{ (verification_result | default({})) | combine({'VM HA: host error detected on host' ~ current_cluster.report_suffix: host_name }) }}"

- name: Check that the hook is triggered (after last timestamp)
  ansible.builtin.shell: |
    awk -F'[][]' -v last_ts="{{ last_host_error_timestamp.stdout | trim }}" '
      BEGIN{found=last_ts==""}
      /^[[]/{
        if($2==last_ts) found=1; else if(found && $0 ~ /Hook launched/) print $0
      }' /var/log/one/host_error.log | grep "Hook launched"
  register: hook_log_check
  delegate_to: "{{ _vm_ha_log_host }}"
  failed_when: hook_log_check.rc != 0
  changed_when: false
  retries: 10
  delay: 10

- name: Save hook triggered
  set_fact:
    verification_result: "{{ verification_result | combine({'VM HA: error hook triggered' ~ current_cluster.report_suffix: 'ok'}) }}"

- name: Check that the fencing gets triggered (this might take several minutes, after last timestamp)
  ansible.builtin.shell: |
    awk -F'[][]' -v last_ts="{{ last_host_error_timestamp.stdout | trim }}" '
      BEGIN{found=last_ts==""}
      /^[[]/{
        if($2==last_ts) found=1; else if(found && $0 ~ /Fencing enabled/) print $0
      }' /var/log/one/host_error.log | grep "Fencing enabled"
  register: fencing_log_check
  delegate_to: "{{ _vm_ha_log_host }}"
  failed_when: fencing_log_check.rc != 0
  changed_when: false
  retries: "{{ _fencing_check_retries }}"
  delay: "{{ _fencing_check_delay }}"
  until: fencing_log_check.rc == 0

- name: Save fencing triggered
  set_fact:
    verification_result: "{{ verification_result | combine({'VM HA: host fencing triggered on host' ~ current_cluster.report_suffix: host_name }) }}"

- name: Check for "Fencing success" in host_error.log (after last timestamp)
  ansible.builtin.shell: |
    awk -F'[][]' -v last_ts="{{ last_host_error_timestamp.stdout | trim }}" '
      BEGIN{found=last_ts==""}
      /^[[]/{
        if($2==last_ts) found=1; else if(found && $0 ~ /Fencing success/) print $0
      }' /var/log/one/host_error.log | grep "Fencing success"
  register: fencing_success_log_check
  delegate_to: "{{ _vm_ha_log_host }}"
  failed_when: fencing_success_log_check.rc != 0
  changed_when: false
  retries: 5
  delay: 5
  until: fencing_success_log_check.rc == 0

- name: Save fencing success
  set_fact:
    verification_result: "{{ verification_result | combine({'VM HA: host fencing successful on host' ~ current_cluster.report_suffix: host_name }) }}"

- name: Check for "Hook finished" in host_error.log (after last timestamp)
  ansible.builtin.shell: |
    awk -F'[][]' -v last_ts="{{ last_host_error_timestamp.stdout | trim }}" '
      BEGIN{found=last_ts==""}
      /^[[]/{
        if($2==last_ts) found=1; else if(found && $0 ~ /Hook finished/) print $0
      }' /var/log/one/host_error.log | grep "Hook finished"
  register: hook_finished_log_check
  delegate_to: "{{ _vm_ha_log_host }}"
  failed_when: hook_finished_log_check.rc != 0
  changed_when: false
  retries: 5
  delay: 5
  until: hook_finished_log_check.rc == 0

- name: Save hook finished
  set_fact:
    verification_result: "{{ verification_result | combine({'VM HA: error hook successful' ~ current_cluster.report_suffix: 'ok'}) }}"

# The -r recreate makes the surviving node PROLOG-clone the image from
# scratch (local TM) — 100s is not enough on slow labs; window configurable.
# The delete-recreate can also WEDGE in CLEANUP_RESUBMIT forever: when the
# cleanup driver command races the fencing power-off, oned cancels it and no
# completion callback ever arrives (observed live: "Driver command for <id>
# cancelled" then silence; the good case fails fast with "No route to host"
# -> "Host successfully cleaned" -> resubmit in seconds). After the VM sits
# in clea* for cleanup_wedge_polls consecutive polls, apply OpenNebula's
# documented operator remedy ONCE — `onevm recover --failure`, which marks
# the in-flight cleanup as failed (true: the host is dead) so the VM
# resubmits. A nudged recovery is reported as WARNING, never silent ok.
- name: Wait for VM to be in running state on a new host (unwedge stalled cleanup)
  ansible.builtin.shell: |
    nudged=""
    stuck=0
    st=""
    for i in $(seq 1 {{ (validation.vm_ha | d({})).recovery_retries | d(60) }}); do
      st=$(onevm list --f ID={{ test_vm_ha_id }} -l STAT --no-header | tr -d ' ')
      if [ "$st" = "runn" ]; then echo "STAT=runn${nudged}"; exit 0; fi
      case "$st" in clea*) stuck=$((stuck+1)) ;; *) stuck=0 ;; esac
      if [ -z "$nudged" ] && [ "$stuck" -ge {{ (validation.vm_ha | d({})).cleanup_wedge_polls | d(12) }} ]; then
        onevm recover --failure {{ test_vm_ha_id }} && nudged=" NUDGED"
      fi
      sleep {{ (validation.vm_ha | d({})).recovery_delay | d(10) }}
    done
    echo "STAT=${st:-?}${nudged}"
    exit 1
  register: vm_recovery
  changed_when: false
  failed_when: vm_recovery.rc != 0

- name: Get new VM hostname after recovery
  ansible.builtin.shell: >
    onevm list --f ID={{ test_vm_ha_id }} -l HOST --no-header
  register: new_vm_hostname
  failed_when: "new_vm_hostname.rc != 0"

- name: Save VM recovery success on new host
  set_fact:
    verification_result: "{{ verification_result | combine({'VM HA: VM recovered successfully on host' ~ current_cluster.report_suffix: _vm_ha_recovery_value}) }}"
  vars:
    _vm_ha_recovery_value: >-
      {{ new_vm_hostname.stdout if 'NUDGED' not in (vm_recovery.stdout | d(''))
         else 'warning — recovered on ' ~ new_vm_hostname.stdout
              ~ " only after 'onevm recover --failure': the hook's delete-recreate wedged in CLEANUP_RESUBMIT against the fenced host (cleanup driver command cancelled by oned, no callback)" }}
