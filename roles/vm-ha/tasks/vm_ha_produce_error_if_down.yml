---
# Downs an interface on the target node to trigger host fencing. The interface
# is intentionally NEVER restored by the suite: it may be the node's only SSH
# path, and the HA hook powers the host off anyway. per_cluster.yml's always
# block re-enables the host in OpenNebula (best effort) and records an
# odv_leftovers host_state entry when the host does not come back — recovery
# is out-of-band by design.
- name: Set fact for interface name to bring down
  set_fact:
    _target_if_name: "{{ validation.vm_ha.if_down_params.interface_name }}"

- name: Bring down the {{ _target_if_name }} interface to simulate error
  ansible.builtin.command: ip link set dev {{ _target_if_name }} down
  async: 15
  poll: 0
  ignore_errors: true

- block:
    - name: Check connectivity for reference or timeout (prevent hang)
      ansible.builtin.wait_for:
        timeout: 10
        host: "{{ ansible_host }}"
        port: 22
        state: started
      delegate_to: localhost
      ignore_errors: true

    - name: Ensure play continues even if connectivity is lost
      meta: clear_host_errors
