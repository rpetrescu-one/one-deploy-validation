---
# The vnet lifecycle (render/create/update/onecluster addvnet+delvnet and the
# manifest entry) lives in the shared service
# roles/validation_common/tasks/ensure_test_vnet.yml so other tests can
# provision the test vnet even when run_test_vm is disabled. This file keeps
# only what is test_vm-specific: the gateway reachability probe and the
# 'Test network creation' report row.

# Runs on every frontend host, as before: each FE independently proves it can
# reach the test network's gateway.
- name: Verify connection to the VNET default gateway
  ansible.builtin.shell: >
    ping -c 1 {{ validation.test_vm.vnet.gateway }}
  register: gw_ping_result
  until: gw_ping_result.rc == 0
  retries: 3
  delay: 10
  when:
    - validation.test_vm.create_vnet
    - validation.test_vm.vm.check_connection

# Primary frontend only: all FEs share one oned, and concurrent `onevnet
# create` from several FEs is a race (pre-existing bug in the old network.yml).
- name: Ensure the test vnet exists for this cluster
  ansible.builtin.include_role:
    name: validation_common
    tasks_from: ensure_test_vnet.yml
  vars:
    ensure_vnet_cluster: "{{ current_cluster }}"
    ensure_role: test_vm
  when: inventory_hostname == groups[frontend_group | d('frontend')][0]

- name: Record test network creation result
  ansible.builtin.include_role:
    name: validation_common
    tasks_from: record_result.yml
  vars:
    result_key: "Test network creation{{ current_cluster.report_suffix }}"
    result_value: >-
      {{ 'ok' if (validation.test_vm.create_vnet | bool)
         else 'skipped — create_vnet disabled, reusing vnet ' ~ current_cluster.vnet_name }}
  when: inventory_hostname == groups[frontend_group | d('frontend')][0]
