---
# Template/image provisioning goes through the shared service so other tests
# (storage-benchmark, oneflow, ...) can provision it independently of
# run_test_vm, and so the exported template+image land in the run manifest.
- name: Ensure the test VM template exists for this cluster
  ansible.builtin.include_role:
    name: validation_common
    tasks_from: ensure_test_template.yml
  vars:
    ensure_app_name: "{{ _test_vm_name }}"
    ensure_name: "{{ _test_vm_name }}{{ current_cluster.name_suffix }}"
    ensure_ds_id: "{{ current_cluster.image_ds_id }}"
    ensure_role: test_vm

# 'ok' only when the marketplace was actually used — in semi air-gapped
# deployments the template pre-exists and the export is skipped inside the
# shared service (_export_cmd is its register and stays visible here).
- name: Record marketplace download result
  ansible.builtin.include_role:
    name: validation_common
    tasks_from: record_result.yml
  vars:
    result_key: "Download a test VM template from the marketplace{{ current_cluster.report_suffix }}"
    result_value: >-
      {{ 'ok' if ((_export_cmd is defined) and (_export_cmd is not skipped)
                  and ((_export_cmd.rc | d(1)) == 0))
         else 'skipped — template pre-exists, marketplace not used' }}

# template_extra is applied inside ensure_test_template.yml (shared service)
# so it also lands when another test provisions the template first
# (run_test_vm: false). Only the report row stays here.
- name: Record VM template update result
  ansible.builtin.include_role:
    name: validation_common
    tasks_from: record_result.yml
  vars:
    result_key: "Updating a VM template{{ current_cluster.report_suffix }}"
    result_value: >-
      {{ 'ok' if (validation.test_vm.vm.template_extra is defined)
         else 'skipped — no template_extra defined' }}

# Per-cluster maps consumed by create_vm, storage-benchmark and
# oneflow_validation; the scalar facts keep the first cluster's IDs for
# backward compatibility (single-cluster behavior unchanged).
- name: Record per-cluster template and image IDs
  ansible.builtin.set_fact:
    test_vm_template_ids: "{{ (test_vm_template_ids | d({})) | combine({current_cluster.name: _export_template_id}) }}"
    test_vm_template_image_ids: "{{ (test_vm_template_image_ids | d({})) | combine({current_cluster.name: _export_image_id}) }}"
    test_vm_template_id: "{{ test_vm_template_id | d(_export_template_id) }}"
    test_vm_template_image_id: "{{ test_vm_template_image_id | d(_export_image_id) }}"
