---
- name: "Test VM: skip — cluster discovery failed"
  ansible.builtin.include_role:
    name: validation_common
    tasks_from: record_result.yml
  vars:
    result_key: "Test VM validation"
    result_value: "skipped — cluster discovery failed"
  when: hostvars[groups[frontend_group | d('frontend')][0]].odv_discovery_failed | d(false)

- name: Run test VM validation per cluster
  ansible.builtin.include_tasks:
    file: per_cluster.yml
  loop: "{{ _one_clusters }}"
  loop_control:
    loop_var: current_cluster
    label: "{{ current_cluster.name }}"
  when: not (hostvars[groups[frontend_group | d('frontend')][0]].odv_discovery_failed | d(false))
