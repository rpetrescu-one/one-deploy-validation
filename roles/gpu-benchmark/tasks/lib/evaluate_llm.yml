---
- name: Evaluate LLM metrics against thresholds
  ansible.builtin.set_fact:
    _llm_eval:
      profile: "{{ _t.profile }}"
      source: "{{ _eval_thresholds_source | default('global') }}"
      thresholds:
        ttft_p95_ms: "{{ _t.ttft_p95_ms }}"
        itl_p95_ms: "{{ _t.itl_p95_ms }}"
        min_throughput_req_s: "{{ _t.min_throughput_req_s }}"
      gated: >-
        {{ (_t.ttft_p95_ms is not none) or (_t.itl_p95_ms is not none)
           or (_t.min_throughput_req_s is not none) }}
      ttft_ok: >-
        {{ _t.ttft_p95_ms is none
           or (_llm_metrics.ttft_p95_ms | float) <= (_t.ttft_p95_ms | float) }}
      itl_ok: >-
        {{ _t.itl_p95_ms is none
           or (_llm_metrics.itl_p95_ms | float) <= (_t.itl_p95_ms | float) }}
      # A TRUNCATED sweep's throughput is a lower bound: above the gate it
      # PASSES definitively; below the gate it is INCONCLUSIVE (the true
      # capacity may well clear it), so it must not fail the run — the
      # report marks it '*' next to the SLO verdict instead.
      throughput_ok: >-
        {{ _t.min_throughput_req_s is none
           or (_llm_metrics.throughput_req_s_mean | float) >= (_t.min_throughput_req_s | float)
           or (_trunc | bool) }}
      throughput_inconclusive: >-
        {{ (_t.min_throughput_req_s is not none)
           and (_trunc | bool)
           and ((_llm_metrics.throughput_req_s_mean | float) < (_t.min_throughput_req_s | float)) }}
  vars:
    _t: "{{ _eval_thresholds | default(gpu_benchmark.thresholds) }}"
    # string-compare: ansible 2.18 stringifies the stored bool and the
    # string 'False' would pass a truthy test. TRUNCATED and UNSATURATED
    # sweeps are both throughput LOWER BOUNDS (chaotic probe vs slow-mode
    # client — see parse_guidellm) and get the same directional treatment.
    _trunc: >-
      {{ ((_llm_metrics.sweep_truncated | default(false) | string) == 'True')
         or ((_llm_metrics.sweep_unsaturated | default(false) | string) == 'True') }}

- name: Derive overall status
  ansible.builtin.set_fact:
    _llm_eval: >-
      {{ _llm_eval | combine({
        'status': ('ok' if ((_llm_eval.ttft_ok | bool) and (_llm_eval.itl_ok | bool) and (_llm_eval.throughput_ok | bool)) else 'flag')
      }) }}
