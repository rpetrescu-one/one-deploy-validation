---
# Sort by RPS gives: the sweep display order, the min-RPS fallback for the
# synchronous run, and the max-RPS row for the drain-burst peak rate. The
# SATURATED headline itself is selected later by max output tok/s (curve peak).
- name: Sort benchmarks by achieved RPS (display order and fallbacks)
  ansible.builtin.set_fact:
    _gl_sorted: >-
      {{ _guidellm_report.benchmarks
         | sort(attribute='metrics.requests_per_second.' ~ gpu_benchmark.guidellm_status ~ '.mean') }}
    _llm_sweep: []

- name: Extract load-sweep rows
  ansible.builtin.set_fact:
    _llm_sweep: >-
      {{ _llm_sweep + [{
        'strategy': _strat.type_ | default(item.id_ | default('?'), true),
        'target_rate': _strat.rate | default('', true),
        'rps': _m.requests_per_second[_s].mean | float | round(2),
        'output_tok_s': _otps if (_otps | string | length > 0) else '',
        'concurrency': _conc if (_conc | string | length > 0) else '',
        'ttft_p95_ms': _m.time_to_first_token_ms[_s].percentiles.p95 | float | round(1),
        'itl_p95_ms': _m.inter_token_latency_ms[_s].percentiles.p95 | float | round(2),
        'requests_ok': (_m.request_totals | default({})).successful | default(''),
        'requests_err': (_m.request_totals | default({})).errored | default(''),
        'requests_incomplete': (_m.request_totals | default({})).incomplete | default('')
      }] }}
  loop: "{{ _gl_sorted }}"
  loop_control:
    label: "{{ (item.config | default({})).strategy.type_ | default(item.id_ | default('?')) }}"
  vars:
    _m: "{{ item.metrics }}"
    _s: "{{ gpu_benchmark.guidellm_status }}"
    _strat: "{{ (item.config | default({})).strategy | default({}) }}"
    _otps: "{{ ((_m.output_tokens_per_second | default({}))[_s] | default({})).mean | default('') }}"
    _conc: "{{ ((_m.request_concurrency | default({}))[_s] | default({})).mean | default('') }}"

- name: Extract headline LLM metrics
  ansible.builtin.set_fact:
    _llm_metrics:
      throughput_req_s_mean: >-
        {{ ((_sat_otps | float) / (_sat_outtok | float)) | round(2)
           if ((_sat_otps | string | length > 0) and ((_sat_outtok | default('0') | float) > 0))
           else (_sat.requests_per_second[_s].mean | float | round(2)) }}
      throughput_req_s_peak: "{{ _sat_rps_row.requests_per_second[_s].mean | float | round(2) }}"
      output_tok_s_saturated: "{{ _sat_otps }}"
      req_latency_p95_s: "{{ _syn.request_latency[_s].percentiles.p95 | float }}"
      ttft_p95_ms: "{{ _syn.time_to_first_token_ms[_s].percentiles.p95 | float }}"
      itl_p95_ms: "{{ _syn.inter_token_latency_ms[_s].percentiles.p95 | float }}"
      tpot_p95_ms: "{{ _syn.time_per_output_token_ms[_s].percentiles.p95 | float }}"
      saturated:
        req_latency_p95_s: "{{ _sat.request_latency[_s].percentiles.p95 | float }}"
        ttft_p95_ms: "{{ _sat.time_to_first_token_ms[_s].percentiles.p95 | float }}"
        itl_p95_ms: "{{ _sat.inter_token_latency_ms[_s].percentiles.p95 | float }}"
        tpot_p95_ms: "{{ _sat.time_per_output_token_ms[_s].percentiles.p95 | float }}"
        # The PEAK row's own sample count — the honest denominator for
        # judging the peak-derived throughput (the whole-sweep total above
        # includes rows the headline no longer comes from).
        requests_ok: "{{ ((_sat.request_totals | default({})).successful | default(0)) | int }}"
      # Tokens-per-request the sustained rate was computed with — consumers
      # (compare_baseline sweep-lift) must divide by the SAME number.
      tokens_per_request: "{{ (_sat_outtok | default('256', true)) if ((_sat_outtok | string | length) > 0) else 256 }}"
      requests_successful: "{{ _llm_sweep | map(attribute='requests_ok') | map('string') | select('ne', '') | map('int') | sum }}"
      requests_errored: "{{ _llm_sweep | map(attribute='requests_err') | map('string') | select('ne', '') | map('int') | sum }}"
      requests_incomplete: "{{ _llm_sweep | map(attribute='requests_incomplete') | map('string') | select('ne', '') | map('int') | sum }}"
      saturation_achieved: "{{ _sat_ok }}"
      # TRUNCATED SWEEP: guidellm derives the constant-rate ladder from its
      # throughput probe; a probe that lands in the chaotic low mode (seen
      # live: 1467 vs 2807 tok/s on identical L40S) caps the whole ladder,
      # so the curve never reaches its knee — the reported peak is then a
      # LOWER BOUND on capacity, not a measurement of it. Two signatures,
      # both restricted to CONCURRENT rows (constant/throughput — the sync
      # row is single-stream by design) and both requiring the curve to
      # still RISE >5% into the peak: (a) the peak sits on the
      # highest-rate row tested; (b) the peak sits on the TOP of the
      # constant ladder while the probe above it collapsed lower. A failed
      # probe (saturation not achieved) is NOT truncation — that label
      # already says the GPU class is too slow for the load, and a re-run
      # would not change it. When the profile BOUNDS the probe
      # (max_concurrency= in guidellm_profile), the probe is an orderly
      # saturated measurement, not an unbounded-queue collapse: the peak
      # landing on the probe row is then the NORMAL converged shape and
      # signature (a) is disarmed (measured stable ±0.5% across runs on
      # L40S). Signature (b) stays armed — a capped probe that still
      # collapses below the ladder top remains a truncation.
      sweep_truncated: >-
        {{ (_sat_ok | bool)
           and (_sat_otps | string | length > 0)
           and ((((not (_probe_capped | bool)))
                 and (_lad_rows | length >= 2)
                 and (_lad_last | string | length > 0) and ((_lad_last | float) > 0)
                 and (_lad_prev | string | length > 0) and ((_lad_prev | float) > 0)
                 and ((_lad_last | float) >= (_sat_otps | float))
                 and ((_lad_last | float) > ((_lad_prev | float) * 1.05)))
                or
                ((_c_rows | length >= 2)
                 and (_c_last | string | length > 0) and ((_c_last | float) > 0)
                 and (_c_prev | string | length > 0) and ((_c_prev | float) > 0)
                 and ((_c_last | float) >= (_sat_otps | float))
                 and ((_c_last | float) > ((_c_prev | float) * 1.05)))) }}
      # UNSATURATED LADDER: the complementary failure to sweep_truncated,
      # PROVEN live 2026-08-11. The guidellm CLIENT is bimodal: in its slow
      # mode the load generator wastes ~1.4 s per request slot (server-side
      # ITL identical in both modes — 26.5 vs 26.9 ms at saturation on the
      # same GPU), so the capped throughput probe under-measures by ~15%
      # and the rate ladder built from it ENDS BEFORE THE KNEE: the last
      # constant rungs still climb linearly (delta ratio 0.89 on the slow
      # run vs 0.10/0.35 on saturated ones) and the reported peak is a
      # LOWER BOUND, not capacity. Both modes appear on the SAME hardware
      # minutes apart (bare-metal baseline: GPU0 slow probe, GPU1 fast).
      # Detector: peak sits on the ladder tail (probe within 25% above the
      # top constant rung) while the last rung-to-rung delta is still
      # >= 60% of the mean earlier delta (the curve never flattened).
      # Consumers treat it exactly like sweep_truncated: lower bound.
      sweep_unsaturated: >-
        {{ (_sat_ok | bool)
           and (_sat_otps | string | length > 0)
           and (_c_outs | length >= 5)
           and ((_sat_otps | float) >= (_c_outs | last | float))
           and ((_sat_otps | float) <= ((_c_outs | last | float) * 1.25))
           and ((_c_last_delta | float) > 0)
           and ((_c_mean_delta | float) > 0)
           and ((_c_last_delta | float) >= ((_c_mean_delta | float) * 0.6))
           and ((_c_outs | last | float) > ((_c_outs | first | float) * 1.05)) }}
      sweep: "{{ _llm_sweep }}"
  vars:
    _tp_by_type: >-
      {{ _gl_sorted | selectattr('config.strategy.type_', 'defined')
         | selectattr('config.strategy.type_', 'eq', 'throughput') | list }}
    _syn_by_type: >-
      {{ _gl_sorted | selectattr('config.strategy.type_', 'defined')
         | selectattr('config.strategy.type_', 'eq', 'synchronous') | list }}
    _syn: "{{ (_syn_by_type | first | default(_gl_sorted | first)).metrics }}"
    # SATURATED = the PEAK of the load curve (max output tok/s), NOT the
    # max-RPS row: on a fast GPU the max-RPS row is the 512-concurrent
    # THROUGHPUT probe measured during overload collapse (queueing, ITL x4),
    # which under-reports capacity and is chaotic run-to-run (observed on
    # L40S: headline 1520-2052 while the curve peak sat stably at ~2805).
    # Falls back to max-RPS when no benchmark reports token rates.
    _by_otps: >-
      {{ _gl_sorted | selectattr('metrics.output_tokens_per_second', 'defined')
         | sort(attribute='metrics.output_tokens_per_second.' ~ gpu_benchmark.guidellm_status ~ '.mean') }}
    _sat: "{{ ((_by_otps | last).metrics) if (_by_otps | length > 0) else ((_gl_sorted | last).metrics) }}"
    # The drain-burst peak rate keeps its OLD source (max-RPS row) — the
    # report note explicitly describes it as the short-window burst.
    _sat_rps_row: "{{ (_gl_sorted | last).metrics }}"
    _s: "{{ gpu_benchmark.guidellm_status }}"
    _sat_otps: "{{ ((_sat.output_tokens_per_second | default({}))[_s] | default({})).mean | default('') }}"
    _sat_outtok: "{{ ((_sat.output_token_count | default({}))[_s] | default({})).mean | default('') }}"
    _sat_ok: >-
      {{ (_tp_by_type | length == 0)
         or ((((_tp_by_type | first).metrics.request_totals | default({})).successful | default(0) | int) > 0) }}
    _probe_capped: "{{ 'max_concurrency=' in (gpu_benchmark.guidellm_profile | default('')) }}"
    # RPS-ascending CONCURRENT rows (constant + throughput probe; rows
    # without a strategy type — legacy reports — are conservatively
    # excluded) and the constant-only ladder. Their last two rows feed the
    # truncation signatures above.
    _lad_rows: >-
      {{ _gl_sorted | selectattr('config.strategy.type_', 'defined')
         | selectattr('config.strategy.type_', 'in', ['constant', 'throughput'])
         | selectattr('metrics.output_tokens_per_second', 'defined') | list }}
    _c_rows: >-
      {{ _gl_sorted | selectattr('config.strategy.type_', 'defined')
         | selectattr('config.strategy.type_', 'eq', 'constant')
         | selectattr('metrics.output_tokens_per_second', 'defined') | list }}
    _lad_last: >-
      {{ ((((_lad_rows | last).metrics.output_tokens_per_second | default({}))[_s] | default({})).mean | default(''))
         if (_lad_rows | length > 0) else '' }}
    _lad_prev: >-
      {{ (((_lad_rows[-2].metrics.output_tokens_per_second | default({}))[_s] | default({})).mean | default(''))
         if (_lad_rows | length >= 2) else '' }}
    _c_last: >-
      {{ ((((_c_rows | last).metrics.output_tokens_per_second | default({}))[_s] | default({})).mean | default(''))
         if (_c_rows | length > 0) else '' }}
    _c_prev: >-
      {{ (((_c_rows[-2].metrics.output_tokens_per_second | default({}))[_s] | default({})).mean | default(''))
         if (_c_rows | length >= 2) else '' }}
    # Constant-rung outputs as a NATIVE float list (filter-built — a jinja
    # {% for %} block would stringify on ansible 2.18 and break indexing).
    _c_outs: >-
      {{ _c_rows | map(attribute='metrics.output_tokens_per_second')
         | map(attribute=_s) | map(attribute='mean')
         | map('float') | select('gt', 0.0) | list }}
    # Knee test without a deltas list: last rung-to-rung delta vs the MEAN
    # of the earlier deltas ((outs[-2]-outs[0])/(n-2)) — below the knee the
    # ladder is near-linear, so the mean is a faithful reference.
    _c_last_delta: >-
      {{ ((_c_outs | last | float) - (_c_outs[-2] | float))
         if (_c_outs | length >= 2) else 0.0 }}
    _c_mean_delta: >-
      {{ (((_c_outs[-2] | float) - (_c_outs | first | float)) / ((_c_outs | length) - 2))
         if (_c_outs | length >= 3) else 0.0 }}
