---
# Contract: package manifest entries ONLY for packages the install actually
# added — pre-installed packages are never manifest-created and never
# removed. The sweep play removes disposition=created package entries; the
# role itself does not uninstall.
- name: "Install ping dependencies (jc, jq)"
  ansible.builtin.include_role:
    name: validation_common
    tasks_from: install_packages_tracked.yml
  vars:
    pkg_names: [jc, jq]
    pkg_role: conn_matrix

- name: Fetch host_name_to_vm_ip mapping from the first frontend node
  set_fact:
    host_name_to_vm_ip: "{{ hostvars[groups[frontend_group | d('frontend')][0]]['host_name_to_vm_ip'] }}"
  when: hostvars[groups[frontend_group | d('frontend')][0]]['host_name_to_vm_ip'] is defined

- name: Fetch hostname-to-cluster mapping from the first frontend node
  set_fact:
    hostname_to_cluster_name: "{{ hostvars[groups[frontend_group | d('frontend')][0]]['hostname_to_cluster_name'] | d({}) }}"

# Register the /32 address and the /32 route we are about to add on the
# bridge, so cleanup.yml can re-derive what to remove with NO facts from this
# phase. Both use the '<cidr>:dev:<bridge>' name format: cleanup intersects
# the entries with the addresses live on the bridge (only the added address
# matches) and attempts `ip route del` for every entry (the pure-address
# entry yields a benign 'No such process', which cleanup tolerates). The
# expressions mirror the shell below exactly so the strings match.
# Loop items are templated BEFORE the per-item when is evaluated, so they
# must render even when this host is absent from the VM map — the '0.0.0.0'
# placeholder only ever renders for skipped items and is never registered.
- name: "Manifest: register bridge address and route"
  ansible.builtin.include_role:
    name: validation_common
    tasks_from: manifest_add.yml
  vars:
    _mapping_length: "{{ host_name_to_vm_ip | d({}) | length }}"
    _cm_my_vm_ip: "{{ (host_name_to_vm_ip | d({})).get(hostname_cmd | d(''), '0.0.0.0') }}"
    manifest_type: ip_addr
    manifest_id: ""
    manifest_name: "{{ item }}"
    manifest_cluster: ""
    manifest_role: conn_matrix
    manifest_disposition: created
  loop:
    - "{{ _cm_my_vm_ip | ansible.utils.ipmath(_mapping_length | int) }}/32:dev:{{ _conn_matrix_bridge_name }}"
    - "{{ _cm_my_vm_ip }}/32:dev:{{ _conn_matrix_bridge_name }}"
  when: hostname_cmd in (host_name_to_vm_ip | d({}))

- name: Add VM IP+offset/32 to {{ _conn_matrix_bridge_name }} and route for each VM IP
  vars:
    _mapping_length: "{{ host_name_to_vm_ip | length }}"
  when: hostname_cmd in (host_name_to_vm_ip | d({}))
  register: add_vm_ip_route
  failed_when: "('Address already assigned' not in add_vm_ip_route.stderr or add_vm_ip_route.rc != 2) \
                and add_vm_ip_route.rc != 0\
                and ('File exists' not in add_vm_ip_route.stderr or add_vm_ip_route.rc != 2)"
  changed_when: add_vm_ip_route.rc == 0
  ansible.builtin.shell: |
    ip addr add {{ host_name_to_vm_ip[hostname_cmd] | ansible.utils.ipmath(_mapping_length) }}/32 dev {{ _conn_matrix_bridge_name }}
    ip route add {{ host_name_to_vm_ip[hostname_cmd] }}/32 dev {{ _conn_matrix_bridge_name }}

- name: "Manifest: register results directory"
  ansible.builtin.include_role:
    name: validation_common
    tasks_from: manifest_add.yml
  vars:
    manifest_type: file
    manifest_id: ""
    manifest_name: "/tmp/conn-matrix-results"
    manifest_cluster: ""
    manifest_role: conn_matrix
    manifest_disposition: created

- name: Ensure results directory exists for this host
  file:
    path: "/tmp/conn-matrix-results/{{ inventory_hostname }}"
    state: directory
    mode: '0755'

- name: Test connectivity from this host to all other VMs
  vars:
    _my_vm_ip: "{{ host_name_to_vm_ip[hostname_cmd] }}"
    _other_hostname: "{{ groups[node_group | d('node')] | map('extract', hostvars) | selectattr('hostname_cmd', 'equalto', other_vm.key) | map(attribute='inventory_hostname') | list | first}}"
  loop: "{{ host_name_to_vm_ip | dict2items }}"
  loop_control:
    loop_var: other_vm
  when:
    - hostname_cmd in (host_name_to_vm_ip | d({}))
    - other_vm.value != _my_vm_ip
    - (hostname_to_cluster_name | d({})).get(other_vm.key, '') == (hostname_to_cluster_name | d({})).get(hostname_cmd, '')
  ansible.builtin.shell: |
    ssh -i ~/.ssh/conn-matrix -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@{{ _my_vm_ip }} -- \
      ping -c {{ _conn_matrix_ping_count }} {{ other_vm.value }} | jc --ping > /tmp/conn-matrix-results/{{ inventory_hostname }}/{{ _other_hostname }}.json
  register: conn_test_result
  retries: 10
  delay: 5
  until: "'Connection refused' not in conn_test_result.stderr and 'No route to host' not in conn_test_result.stderr"

- name: Read the results of the connection matrix test
  vars:
    _my_vm_ip: "{{ host_name_to_vm_ip[hostname_cmd] }}"
    _other_hostname: "{{ groups[node_group | d('node')] | map('extract', hostvars) | selectattr('hostname_cmd', 'equalto', other_vm.key) | map(attribute='inventory_hostname') | list | first}}"
  ansible.builtin.slurp:
    src: "/tmp/conn-matrix-results/{{ inventory_hostname }}/{{ _other_hostname }}.json"
  loop: "{{ host_name_to_vm_ip | dict2items }}"
  loop_control:
    loop_var: other_vm
  when:
    - hostname_cmd in (host_name_to_vm_ip | d({}))
    - other_vm.value != _my_vm_ip
    - (hostname_to_cluster_name | d({})).get(other_vm.key, '') == (hostname_to_cluster_name | d({})).get(hostname_cmd, '')
  register: slurped_files
  no_log: true

- name: Build a dictionary of file contents
  when: hostname_cmd in (host_name_to_vm_ip | d({}))
  set_fact:
    conn_results_vector: >-
      {{ dict(
          slurped_files.results | selectattr('source', 'defined') | map(attribute='source') | 
          zip(slurped_files.results | selectattr('source', 'defined') | map(attribute='content') | map('b64decode') | map('from_json'))
        )
      }}
