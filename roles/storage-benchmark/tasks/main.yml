---
- name: Ensure storage benchmark validation variables are set with defaults
  set_fact:
    validation: >-
      {{
        validation | default({}) | combine({
          'run_storage_benchmark': validation.run_storage_benchmark | default(true),
          'storage_benchmark': validation.storage_benchmark | default({
            'vnet_name': 'VLAN_580'
          })
        }, recursive=True)
      }}

- name: Run storage benchmark test per cluster and template
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/tasks/storage_benchmark.yml"
  when: hostvars[_primary_frontend]['ansible_host'] == ansible_host
  loop: "{{ _one_clusters | product(_sb_templates) | list }}"
  loop_control:
    loop_var: _sb_pair
    label: "{{ _sb_pair.0.name }} / {{ _sb_pair.1 }}"
  vars:
    _sb_templates: "{{ validation.storage_benchmark.templates | d([validation.test_vm.vm.market_name]) }}"

