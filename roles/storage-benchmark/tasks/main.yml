---
- name: Ensure storage benchmark validation variables are set with defaults
  set_fact:
    validation: >-
      {{
        validation | default({}) | combine({
          'run_storage_benchmark': validation.run_storage_benchmark | default(true),
          'storage_benchmark': validation.storage_benchmark | default({
            'vnet_name': 'VLAN_580'
          })
        }, recursive=True)
      }}

# Run-to-completion: when cluster discovery failed, record an explicit skip
# instead of leaving the report row silently absent. Recorded only on the
# primary frontend (the host the report play reads facts from).
- name: "Storage benchmark: skip — cluster discovery failed"
  ansible.builtin.include_role:
    name: validation_common
    tasks_from: record_result.yml
  vars:
    result_key: "Storage benchmark"
    result_value: "skipped — cluster discovery failed"
  when:
    - hostvars[groups[frontend_group | d('frontend')][0]].odv_discovery_failed | d(false)
    - hostvars[_primary_frontend]['ansible_host'] == ansible_host

- name: Run storage benchmark test per cluster and template
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/tasks/storage_benchmark.yml"
  when:
    - hostvars[_primary_frontend]['ansible_host'] == ansible_host
    - not (hostvars[_primary_frontend].odv_discovery_failed | d(false))
    - validation.run_storage_benchmark | d(true)
  loop: "{{ _one_clusters | product(_sb_templates) | list }}"
  loop_control:
    loop_var: _sb_pair
    label: "{{ _sb_pair.0.name }} / {{ _sb_pair.1 }}"
  vars:
    _sb_templates: "{{ validation.storage_benchmark.templates | d([_sb_default_template_name]) }}"
