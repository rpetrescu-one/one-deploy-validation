---

- setup:
    gather_subset:
    - min

- name: Install required task dependencies
  ansible.builtin.package:
    name:
      - jq
    state: present

# Check VIP reachability from all the FE nodes
- name: Check connection to API through a VIP from all FEs
  ansible.builtin.wait_for:
    host: "{{ one_vip }}"
    port: 2633
  register: vip_reachability
   
- name: Verify VIP reachability from all FEs
  debug:
    msg: "{{ vip_reachability.state }}"

- name: Save VIP reachability from all FEs
  set_fact:
    verification_result: "{{ (verification_result | default({})) | combine({'VIP connectivity from all FEs': 'ok'}) }}"


# Get zone details from the first FE, Assuming state set to 3 is the leader state
- name: Get Zone
  ansible.builtin.shell:
    cmd: onezone show "{{ validation.fe_ha.one_zone_name }}" -j | jq -r '.ZONE.SERVER_POOL.SERVER | .[] |select(.STATE == "3") | .NAME'
  register: zone_details 
  ignore_errors: true
  when: hostvars[groups[frontend_group | d('frontend')][0]]['ansible_host'] == ansible_host 
  run_once: true    

# Test to verify that content of /etc/one directory is the same at all FE nodes
- name: Check content of the config directories
  find:
    path: "{{ item }}"
    file_type: file
    recurse: true 
  register: found_files
  loop: "{{ validation.fe_ha.one_config_path }}"

- name: Set combined list 
  set_fact:
    combined_file_list: "{{ combined_file_list | default([]) + item.files }}"
  loop: "{{ found_files.results }}"

- name: Set config diff exclude patterns
  ansible.builtin.set_fact:
    config_diff_exclude_patterns: "{{ validation.fe_ha.config_diff_exclude_patterns | default(['\\.bak$']) }}"

- name: Exclude configured files from config diff
  ansible.builtin.set_fact:
    combined_file_list: "{{ combined_file_list | rejectattr('path', 'search', item) | list }}"
  loop: "{{ config_diff_exclude_patterns }}"
  when: config_diff_exclude_patterns | length > 0

- name: Read config files without changing disk
  ansible.builtin.slurp:
    src: "{{ item.path }}"
  loop: "{{ combined_file_list }}"
  register: config_file_contents_raw
  no_log: true

- name: Save sanitized config file content per host
  ansible.builtin.set_fact:
    config_file_contents: >-
      {{
        config_file_contents | default({}) | combine({
          item.item.path: (
            (item.content | b64decode)
            | regex_replace('(?m)^\s*SERVER_ID\s*=.*(?:\n|$)', '')
            if item.item.path == '/etc/one/oned.conf'
            else (item.content | b64decode)
          )
        })
      }}
  loop: "{{ config_file_contents_raw.results }}"
  when:
    - item.content is defined
    - not item.failed | default(false)
  no_log: true

- name: Build complete config file list across FE nodes
  ansible.builtin.set_fact:
    all_config_files: >-
      {{
        groups[frontend_group | d('frontend')]
        | map('extract', hostvars, 'config_file_contents')
        | map('default', {})
        | map('dict2items')
        | flatten
        | map(attribute='key')
        | unique
        | sort
      }}
    config_reference_host: "{{ groups[frontend_group | d('frontend')][0] }}"
    config_differences: {}
  run_once: true

- name: Compare sanitized config file contents across all FE nodes
  ansible.builtin.set_fact:
    config_differences: >-
      {{
        config_differences | combine({
          item.0: (
            config_differences.get(item.0, {}) | combine({
              item.1: {
                'status': 'file presence differs' if not (ref_has_file | bool and host_has_file | bool) else 'content differs',
                'reference_host': config_reference_host,
                'reference_present': ref_has_file | bool,
                'host_present': host_has_file | bool,
                'reference_line_count': (reference_files[item.1].splitlines() | length) if ref_has_file | bool else 0,
                'host_line_count': (host_files[item.1].splitlines() | length) if host_has_file | bool else 0,
                'reference_sha256': (reference_files[item.1] | hash('sha256')) if ref_has_file | bool else '',
                'host_sha256': (host_files[item.1] | hash('sha256')) if host_has_file | bool else '',
                'reference_only_lines': (reference_files[item.1].splitlines() | difference(host_files[item.1].splitlines())) if ref_has_file | bool and host_has_file | bool else (reference_files[item.1].splitlines() if ref_has_file | bool else []),
                'host_only_lines': (host_files[item.1].splitlines() | difference(reference_files[item.1].splitlines())) if ref_has_file | bool and host_has_file | bool else (host_files[item.1].splitlines() if host_has_file | bool else [])
              }
            })
          )
        }, recursive=True)
      }}
  loop: "{{ (groups[frontend_group | d('frontend')] | difference([config_reference_host])) | product(all_config_files) | list }}"
  vars:
    reference_files: "{{ hostvars[config_reference_host].config_file_contents | default({}) }}"
    host_files: "{{ hostvars[item.0].config_file_contents | default({}) }}"
    ref_has_file: "{{ item.1 in reference_files }}"
    host_has_file: "{{ item.1 in host_files }}"
  when: >-
    not (ref_has_file | bool and host_has_file | bool)
    or reference_files[item.1] != host_files[item.1]
  no_log: true
  run_once: true

- name: Build config comparison report
  ansible.builtin.set_fact:
    config_diff_report:
      status: "{{ 'error - config file differences found' if config_differences | length > 0 else 'ok' }}"
      reference_host: "{{ config_reference_host }}"
      exclude_patterns: "{{ config_diff_exclude_patterns }}"
      differences: "{{ config_differences }}"
  no_log: true
  run_once: true

- name: Save file content checks
  ansible.builtin.set_fact:
    verification_result: >-
      {{
        verification_result | combine({
          'Check content of the config directory for file diffs at all FE nodes':
            config_diff_report.status
        })
      }}
    verification_comments: >-
      {{
        verification_comments | default({}) | combine({
          'Check content of the config directory for file diffs at all FE nodes':
            config_diff_report
        })
      }}
  run_once: true

### Leader failover tests
#
- name: Set initial leader node
  set_fact:
    initial_leader: "{{ zone_details.stdout }}"
  run_once: true

- name: Display current leder node
  debug:
    msg: "Current leader node is {{ initial_leader }}"

- name: Save Initial Leader node
  set_fact:
    verification_result: "{{ verification_result | combine({'Initial FE leader node': initial_leader }) }}"


- name: Stop OpenNebula oned service on the current leader to simulate failure
  systemd:
    name: opennebula
    state: stopped
  delegate_to: "{{ initial_leader }}" # Stop service on the identified leader
  #when: ansible_host  == initial_leader
  run_once: true

  # Give OpenNebula's internal HA mechanism time to elect a new leader  
- name: Wait for leader failover
  pause:
    seconds: 20 
  run_once: true 
  
- name: Check that one VIP was migrated and reachable from all FE nodes
  ansible.builtin.wait_for:
    host: "{{ one_vip }}"
    port: 2633
  register: vip_reachability

- name: Save VIP reachability post migration
  set_fact:
    verification_result: "{{ verification_result | combine({'VIP reachability after leader migration': 'ok' }) }}" 
  
- name: Verify VIP reachability from all FEs
  debug:
    msg: "{{ vip_reachability.state }}"


- name: Get a new leader id
  ansible.builtin.shell:
    cmd: onezone show "{{ one_zone_name }}" -j | jq -r '.ZONE.SERVER_POOL.SERVER | .[] |select(.STATE == "3") | .NAME'
  register: migrated_leader
  ignore_errors: true
  when: initial_leader != ansible_host
  run_once: true
  
- name: Set a new leader node
  set_fact:
    migrated_leader: "{{ migrated_leader.stdout }}"
  #delegate_to: 
  #when: hostvars[groups[frontend_group | d('frontend')][1]]['ansible_host'] == ansible_host    
  run_once: true

- name: Save a new Leader node
  set_fact:
    verification_result: "{{ verification_result | combine({'A new FE leader node after the failover': migrated_leader }) }}"

- name: Check that a leader indeed new
  debug:
    msg: "Original leader: {{ initial_leader }} a new leader is: {{ migrated_leader }}"
  when: initial_leader != migrated_leader
  run_once: true

  # Start OpenNebula service on the original leader
- name: Recover stopped leader
  systemd:
    name: opennebula
    state: started
  delegate_to: "{{ initial_leader }}"
  run_once: true

- name: Render results template
  delegate_to: localhost
  become: false
  vars:
    date: "{{ '%Y-%m-%d %H:%M:%S' | strftime(ansible_date_time.epoch) }}"
  template:
    src: report_template.j2
    dest: /tmp/fe_ha_report.html
  ignore_errors: True

